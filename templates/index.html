<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 스마트 주식 대시보드 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <h1>스마트 주식 대시보드 Pro</h1>
            </div>
            <div class="header-controls">
                <div class="market-status" id="marketStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">시장 확인 중...</span>
                </div>
                <button class="btn-icon" id="refreshBtn" title="새로고침">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="btn-icon" id="settingsBtn" title="설정">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="btn-icon" id="themeToggle" title="다크모드 전환">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="main-container">
        <!-- 검색 및 추가 패널 -->
        <section class="search-section">
            <div class="search-card">
                <h2><i class="fas fa-search"></i> 종목 검색 및 추가</h2>
                <div class="search-box">
                    <input type="text" id="stockSearch" placeholder="종목명 또는 종목코드 입력 (예: 삼성전자, 005930)" maxlength="20">
                    <button class="btn-primary" id="searchBtn">
                        <i class="fas fa-search"></i> 검색
                    </button>
                </div>
                <div class="search-results" id="searchResults"></div>
                <div class="quick-add">
                    <span class="label">인기 종목:</span>
                    <button class="chip" data-code="005930.KS">삼성전자</button>
                    <button class="chip" data-code="035420.KS">NAVER</button>
                    <button class="chip" data-code="035720.KQ">카카오</button>
                    <button class="chip" data-code="051910.KS">LG화학</button>
                    <button class="chip" data-code="006400.KS">삼성SDI</button>
                </div>
            </div>
        </section>

        <!-- 알림 설정 패널 -->
        <section class="notification-section" id="notificationSection" style="display: none;">
            <div class="notification-card">
                <h3><i class="fas fa-bell"></i> 알림 설정</h3>
                <div class="notification-controls">
                    <label class="toggle-switch">
                        <input type="checkbox" id="notifEnabled">
                        <span class="slider"></span>
                        <span class="label">브라우저 알림 받기</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoRefresh" checked>
                        <span class="slider"></span>
                        <span class="label">자동 새로고침 (60초)</span>
                    </label>
                </div>
                <div class="alert-settings">
                    <div class="alert-item">
                        <span>RSI 과매수/과매도 알림</span>
                        <label class="toggle-switch small">
                            <input type="checkbox" id="rsiAlert" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="alert-item">
                        <span>골든/데드 크로스 알림</span>
                        <label class="toggle-switch small">
                            <input type="checkbox" id="crossAlert" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <!-- 마지막 업데이트 시간 -->
        <div class="update-info" id="updateInfo">
            <span><i class="fas fa-clock"></i> 마지막 업데이트: <span id="lastUpdate">-</span></span>
            <span class="auto-refresh-indicator" id="refreshIndicator">
                <i class="fas fa-sync fa-spin"></i> 자동 갱신 중
            </span>
        </div>

        <!-- 종목 카드 그리드 -->
        <section class="stocks-grid" id="stocksGrid">
            <!-- 동적으로 생성됨 -->
            <div class="loading-skeleton">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>
    </main>

    <!-- 토스트 알림 컨테이너 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
