name: Update Stock Dashboard

on:
  schedule:
    - cron: '0 7 * * 1-5'   # KST 오후 4시, 월~금
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: pip install --upgrade yfinance pandas

      - name: 대시보드 생성 스크립트 실행
        run: python dashboard.py

      - name: 변경된 파일 저장 및 자동 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add dashboard.html
          git add tickers.json || true
          git commit -m "Automated dashboard update" || echo "No changes to commit"
          git push
