name: Update Stock Dashboard

on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

# 봇에게 레포지토리에 파일을 쓰고(write) 수정할 수 있는 완벽한 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node 20 경고를 없애기 위해 checkout 버전을 v4 최신형으로 업그레이드
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      # 파이썬 셋업 버전도 v5 최신형으로 업그레이드
      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 귀찮은 requirements.txt 다 무시하고 직접 강제 설치
      - name: 필요 라이브러리 강제 설치
        run: pip install yfinance pandas

      - name: 대시보드 생성 스크립트 실행
        run: python dashboard.py

      - name: 변경된 HTML 저장 및 자동 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git commit -m "Automated dashboard update" || echo "No changes to commit"
          git push
